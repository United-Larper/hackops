packages:
  - apps/*
  - packages/*

# pnpm 10 blocks install scripts unless the package is listed here.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - better-sqlite3
  - "@swc/core"
  - esbuild
  - sharp

# Security: effect <=3.22.0 has a ReDoS (GHSA-7589-6fvf-x4pw); it comes in through Prisma's config loader. Drop once Prisma ships a fixed version.
overrides:
  effect: "^3.22.1"
